<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handwritten Digit Classifier</title>
<style>
  :root {
    --bg:         #0e0e0f;
    --surface:    #181819;
    --border:     #2a2a2d;
    --border-hi:  #3d3d42;
    --text:       #e8e8ea;
    --muted:      #6b6b72;
    --accent:     #4f8ef7;
    --accent-dim: #1e3560;
    --success:    #3ecf6e;
    --error:      #e05252;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  /* ── Header ── */
  header {
    width: 100%;
    max-width: 760px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding-bottom: 16px;
    border-bottom: 0.5px solid var(--border);
    margin-bottom: 24px;
  }
  header h1  { font-size: 15px; font-weight: 500; letter-spacing: .04em; }
  header .tag { font-size: 11px; color: var(--muted); letter-spacing: .06em; }

  /* ── Main layout ── */
  .layout {
    width: 100%;
    max-width: 760px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .panel-label {
    font-size: 10px;
    letter-spacing: .1em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ── Canvas ── */
  canvas#draw-canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    background: #000;
    border-radius: 8px;
    cursor: crosshair;
    touch-action: none;
    image-rendering: pixelated;
    border: 0.5px solid var(--border-hi);
  }

  /* ── Buttons ── */
  .btn-row { display: flex; gap: 8px; margin-top: 12px; }

  button.action {
    flex: 1;
    padding: 9px 0;
    font-family: var(--mono);
    font-size: 12px;
    border-radius: 6px;
    border: 0.5px solid var(--border-hi);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s;
    letter-spacing: .03em;
  }
  button.action:hover  { background: #222; color: var(--text); }
  button.action:active { transform: scale(.97); }

  #classify-btn {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
  #classify-btn:hover    { background: var(--accent-dim); }
  #classify-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  /* ── Status ── */
  .status-line {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    min-height: 16px;
  }
  .status-line.active { color: var(--accent); }
  .status-line.done   { color: var(--success); }
  .status-line.error  { color: var(--error); }

  /* ── Result hero ── */
  .result-hero { text-align: center; padding: 10px 0 6px; }
  .result-hero .digit {
    font-size: 72px;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
    letter-spacing: -4px;
    transition: all .25s cubic-bezier(.4,0,.2,1);
  }
  .result-hero .conf { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── Probability bars ── */
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .bar-idx  { font-size: 11px; color: var(--muted); width: 10px; text-align: right; flex-shrink: 0; }
  .bar-track { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill  {
    height: 100%; width: 0%;
    background: var(--muted);
    border-radius: 3px;
    transition: width .35s cubic-bezier(.4,0,.2,1), background .25s;
  }
  .bar-fill.top { background: var(--accent); }
  .bar-pct { font-size: 10px; color: var(--muted); width: 36px; text-align: right; flex-shrink: 0; }

  /* ── Preview ── */
  .preview-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  canvas#preview-canvas {
    image-rendering: pixelated;
    border: 0.5px solid var(--border-hi);
    border-radius: 4px;
    flex-shrink: 0;
    width: 56px; height: 56px;
  }
  .preview-meta { font-size: 10px; color: var(--muted); line-height: 1.8; }

  @media (max-width: 520px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>collinapjoseph/handwritten-digit-api</h1>
  <span class="tag">pytorch · onnx · fastapi · docker</span>
</header>

<!-- Main grid -->
<div class="layout">

  <!-- Left: draw -->
  <div>
    <div class="panel">
      <div class="panel-label">draw a digit</div>
      <canvas id="draw-canvas" width="280" height="280"></canvas>
      <div class="btn-row">
        <button class="action" id="clear-btn">clear</button>
        <button class="action" id="classify-btn">classify →</button>
      </div>
      <div class="status-line" id="status">draw a digit, then classify</div>
    </div>
  </div>

  <!-- Right: results -->
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="panel" style="flex:0 0 auto">
      <div class="panel-label">prediction</div>
      <div class="result-hero">
        <div class="digit" id="result-digit">—</div>
        <div class="conf"  id="result-conf">confidence: —</div>
      </div>
    </div>

    <div class="panel" style="flex:1">
      <div class="panel-label">class probabilities</div>
      <div class="bars" id="bars-container"></div>
      <div class="preview-row">
        <canvas id="preview-canvas" width="28" height="28"></canvas>
        <div class="preview-meta" id="preview-meta">
          28 × 28 px<br>normalised input<br>shown after classify
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const DRAW_SIZE    = 280;
const MODEL_SIZE   = 28;
const BRUSH_RADIUS = 14;

// ── Elements ─────────────────────────────────────────────────────────────────
const drawCanvas    = document.getElementById('draw-canvas');
const dctx          = drawCanvas.getContext('2d');
const previewCanvas = document.getElementById('preview-canvas');
const pctx          = previewCanvas.getContext('2d');
const statusEl      = document.getElementById('status');
const resultDigit   = document.getElementById('result-digit');
const resultConf    = document.getElementById('result-conf');
const barsContainer = document.getElementById('bars-container');
const classifyBtn   = document.getElementById('classify-btn');
const clearBtn      = document.getElementById('clear-btn');
const previewMeta   = document.getElementById('preview-meta');

// ── State ─────────────────────────────────────────────────────────────────────
let drawing     = false;
let hasMark     = false;
let lastX = 0, lastY = 0;

// ── Init canvas ───────────────────────────────────────────────────────────────
dctx.fillStyle = '#000';
dctx.fillRect(0, 0, DRAW_SIZE, DRAW_SIZE);

// ── Build probability bars ────────────────────────────────────────────────────
for (let i = 0; i < 10; i++) {
  const row = document.createElement('div');
  row.className = 'bar-row';
  row.innerHTML = `
    <span class="bar-idx">${i}</span>
    <div class="bar-track"><div class="bar-fill" id="bf${i}"></div></div>
    <span class="bar-pct" id="bp${i}">—</span>`;
  barsContainer.appendChild(row);
}

// ── Canvas drawing ────────────────────────────────────────────────────────────
function getPos(e) {
  const r  = drawCanvas.getBoundingClientRect();
  const sx = DRAW_SIZE / r.width, sy = DRAW_SIZE / r.height;
  const src = e.touches ? e.touches[0] : e;
  return [(src.clientX - r.left) * sx, (src.clientY - r.top) * sy];
}

function drawStroke(x0, y0, x1, y1) {
  dctx.strokeStyle = '#fff';
  dctx.lineWidth   = BRUSH_RADIUS * 2;
  dctx.lineCap     = 'round';
  dctx.lineJoin    = 'round';
  dctx.beginPath();
  dctx.moveTo(x0, y0);
  dctx.lineTo(x1, y1);
  dctx.stroke();
}

drawCanvas.addEventListener('mousedown',  e => { drawing = true; hasMark = true; [lastX, lastY] = getPos(e); });
drawCanvas.addEventListener('mousemove',  e => { if (!drawing) return; const [x,y] = getPos(e); drawStroke(lastX,lastY,x,y); [lastX,lastY]=[x,y]; });
drawCanvas.addEventListener('mouseup',    () => drawing = false);
drawCanvas.addEventListener('mouseleave', () => drawing = false);
drawCanvas.addEventListener('touchstart',  e => { e.preventDefault(); drawing=true; hasMark=true; [lastX,lastY]=getPos(e); }, {passive:false});
drawCanvas.addEventListener('touchmove',   e => { e.preventDefault(); if(!drawing)return; const [x,y]=getPos(e); drawStroke(lastX,lastY,x,y); [lastX,lastY]=[x,y]; }, {passive:false});
drawCanvas.addEventListener('touchend',    () => drawing = false);

// ── Clear ─────────────────────────────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  dctx.fillStyle = '#000';
  dctx.fillRect(0, 0, DRAW_SIZE, DRAW_SIZE);
  pctx.fillStyle = '#000';
  pctx.fillRect(0, 0, MODEL_SIZE, MODEL_SIZE);
  hasMark = false;
  resultDigit.textContent = '—';
  resultConf.textContent  = 'confidence: —';
  for (let i = 0; i < 10; i++) {
    document.getElementById(`bf${i}`).style.width = '0%';
    document.getElementById(`bf${i}`).classList.remove('top');
    document.getElementById(`bp${i}`).textContent = '—';
  }
  previewMeta.innerHTML = '28 × 28 px<br>normalised input<br>shown after classify';
  setStatus('canvas cleared');
});

// ── Status helper ─────────────────────────────────────────────────────────────
function setStatus(msg, cls = '') {
  statusEl.textContent = msg;
  statusEl.className   = 'status-line' + (cls ? ' ' + cls : '');
}

// ── Classify ──────────────────────────────────────────────────────────────────
classifyBtn.addEventListener('click', async () => {
  if (!hasMark) { setStatus('draw a digit first', 'error'); return; }

  setStatus('preprocessing…', 'active');
  classifyBtn.disabled = true;

  // Scale draw canvas down to 28×28 in a scratch canvas.
  const tmp = document.createElement('canvas');
  tmp.width = MODEL_SIZE; tmp.height = MODEL_SIZE;
  const tc  = tmp.getContext('2d');
  tc.drawImage(drawCanvas, 0, 0, MODEL_SIZE, MODEL_SIZE);

  // Show the 28×28 input in the preview canvas.
  const imgData = tc.getImageData(0, 0, MODEL_SIZE, MODEL_SIZE);
  pctx.putImageData(imgData, 0, 0);

  const nonzero = Array.from(imgData.data)
    .filter((_, i) => i % 4 === 0 && imgData.data[i] > 13).length;
  previewMeta.innerHTML = `28 × 28 px input<br>${nonzero} active pixels<br>μ=0.1307 σ=0.3081`;

  // Convert to PNG blob and POST as multipart/form-data.
  tmp.toBlob(async blob => {
    const form = new FormData();
    form.append('file', blob, 'digit.png');

    setStatus('sending to /cnn…', 'active');

    try {
      // Relative URL — the browser sends the request to the same host that
      // served this page, so no CORS headers are needed.
      const res = await fetch('/cnn', {
        method: 'POST',
        body: form,
        signal: AbortSignal.timeout(5000),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: res.statusText }));
        throw new Error(err.detail || res.statusText);
      }

      const { digit, confidence } = await res.json();

      resultDigit.textContent = digit;
      resultConf.textContent  = `confidence: ${(confidence * 100).toFixed(1)}%`;

      for (let i = 0; i < 10; i++) {
        const fill = document.getElementById(`bf${i}`);
        const pct  = document.getElementById(`bp${i}`);
        if (i === digit) {
          fill.style.width = (confidence * 100).toFixed(1) + '%';
          fill.classList.add('top');
          pct.textContent  = (confidence * 100).toFixed(1) + '%';
        } else {
          fill.style.width = '0%';
          fill.classList.remove('top');
          pct.textContent  = '—';
        }
      }

      setStatus(`/cnn → ${digit}  ·  ${(confidence * 100).toFixed(1)}% confidence`, 'done');

    } catch (err) {
      setStatus('error: ' + err.message, 'error');
    } finally {
      classifyBtn.disabled = false;
    }
  }, 'image/png');
});
</script>
</body>
</html>
